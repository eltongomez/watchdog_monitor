<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5">
    <title>Watchdog Monitor Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2em;
            margin: 10px 0;
        }
        
        .status-ok {
            background: #10b981;
            color: white;
        }
        
        .status-warning {
            background: #f59e0b;
            color: white;
        }
        
        .status-error {
            background: #ef4444;
            color: white;
        }
        
        .status-offline {
            background: #6b7280;
            color: white;
        }
        
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .metric-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .metric-card:hover {
            transform: translateY(-5px);
        }
        
        .metric-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .metric-label {
            font-size: 0.9em;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        
        .metric-value {
            font-size: 1.3em;
            font-weight: bold;
        }
        
        .metric-ok {
            color: #10b981;
        }
        
        .metric-warning {
            color: #f59e0b;
        }
        
        .metric-error {
            color: #ef4444;
        }
        
        .timestamp {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 20px;
            font-size: 0.9em;
        }
        
        .auto-refresh {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 10px;
            font-size: 0.8em;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        
        .manual-refresh {
            display: block;
            margin: 10px auto;
            padding: 12px 35px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            border-radius: 50px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .manual-refresh:hover {
            background: white;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ Watchdog Monitor</h1>
            <div class="status-badge status-warning">
                1 AVISOS
            </div>
        </div>
        
        <div class="metrics">
            <div class="metric-card">
                <div class="metric-icon">💻</div>
                <div class="metric-label">SMC</div>
                <div class="metric-value metric-ok">OK</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-icon">🌡️</div>
                <div class="metric-label">Temperatura</div>
                <div class="metric-value metric-ok">OK (0)</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-icon">💾</div>
                <div class="metric-label">Disco I/O</div>
                <div class="metric-value metric-ok">OK (1s)</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-icon">⚡</div>
                <div class="metric-label">Carga</div>
                <div class="metric-value metric-ok">CRÍTICO (5.19)</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-icon">🧠</div>
                <div class="metric-label">Memória</div>
                <div class="metric-value metric-ok">OK (1176MB)</div>
            </div>
        </div>
        
        <a href="dashboard.html" class="manual-refresh">🔄 Atualizar Agora</a>
        
        <div class="auto-refresh">
            ⟳ Atualização automática a cada 5 segundos
        </div>
        
        <div class="timestamp">
            Última atualização: 2026-02-17 01:36:52
        </div>
    </div>
</body>
</html>
