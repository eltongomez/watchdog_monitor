# Configuração de Recuperação Automática
# Watchdog Monitor v2.0

# ═══════════════════════════════════════════════════════════
# HABILITAR/DESABILITAR RECUPERAÇÃO AUTOMÁTICA
# ═══════════════════════════════════════════════════════════

RECOVERY_ENABLED=true

# ═══════════════════════════════════════════════════════════
# AÇÕES POR TIPO DE PROBLEMA
# ═══════════════════════════════════════════════════════════

# SMC não responde (CRÍTICO!)
RECOVER_SMC=true
SMC_AUTO_REBOOT=false  # true = reinicialização automática sem perguntar

# Memória baixa
RECOVER_MEMORY=true
MEMORY_AUTO_PURGE=true

# I/O lento
RECOVER_IO=true
IO_STOP_SPOTLIGHT=true  # Parar Spotlight temporariamente

# Carga alta
RECOVER_LOAD=true
LOAD_REDUCE_PRIORITY=true  # Reduzir prioridade de processos pesados

# Temperatura alta
RECOVER_THERMAL=true
THERMAL_NOTIFY_ONLY=true  # Apenas notificar (não tomar ações)

# ═══════════════════════════════════════════════════════════
# LIMITES E THRESHOLDS
# ═══════════════════════════════════════════════════════════

# Quantos problemas simultâneos ativam recuperação múltipla
MULTIPLE_PROBLEMS_THRESHOLD=3

# Aguardar quantos segundos após recuperação SMC
SMC_RECOVERY_WAIT=30

# Tempo para reinicialização preventiva (segundos)
EMERGENCY_REBOOT_COUNTDOWN=60

# ═══════════════════════════════════════════════════════════
# NOTIFICAÇÕES
# ═══════════════════════════════════════════════════════════

NOTIFY_ON_RECOVERY=true
NOTIFY_SOUND_WARNING="Basso"
NOTIFY_SOUND_CRITICAL="Sosumi"
NOTIFY_SOUND_SUCCESS="Glass"

# ═══════════════════════════════════════════════════════════
# LOG
# ═══════════════════════════════════════════════════════════

LOG_RECOVERY_ACTIONS=true
RECOVERY_LOG_FILE="$HOME/Projects/watchdog_monitor/logs/watchdog_recovery.log"
